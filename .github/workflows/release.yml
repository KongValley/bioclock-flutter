name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.1.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install dependencies & run checks
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/bioclock-flutter-${RELEASE_TAG}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Build Windows Release
        shell: pwsh
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\bioclock-flutter-${env:RELEASE_TAG}-windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          retention-days: 1

  publish:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS and publish Release
        run: |
          cd dist
          sha256sum "bioclock-flutter-${RELEASE_TAG}-android.apk" "bioclock-flutter-${RELEASE_TAG}-windows-x64.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          COMMIT_SHA=$(git rev-parse HEAD)
          printf '%s\n' \
            "## BioClock Flutter ${RELEASE_TAG}" \
            "" \
            "### 安装产物" \
            "" \
            "- **\`bioclock-flutter-${RELEASE_TAG}-android.apk\`**：Android 安装包（\`minSdk 24\`，使用仓库当前调试签名配置）。" \
            "- **\`bioclock-flutter-${RELEASE_TAG}-windows-x64.zip\`**：Windows x64 便携压缩包，解压后运行 \`bioclock.exe\`。" \
            "- **\`SHA256SUMS.txt\`**：各安装产物的 SHA-256 校验值。" \
            "" \
            "### 校验信息" \
            "" \
            "- 自动化检查：\`flutter analyze\` 无告警；\`flutter test\` 全部通过。" \
            "- 构建提交：\`${COMMIT_SHA}\`" \
            "" \
            "> 本应用仅用于个人记录与提醒，不提供任何医学诊断、治疗或用药建议；所有用药方案、剂量与间隔均应严格遵照医嘱执行。" \
            > release_notes.md

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "dist/bioclock-flutter-${RELEASE_TAG}-android.apk" \
              "dist/bioclock-flutter-${RELEASE_TAG}-windows-x64.zip" \
              "dist/SHA256SUMS.txt" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "BioClock Flutter ${RELEASE_TAG}" \
              --draft=false
          else
            gh release create "${RELEASE_TAG}" \
              "dist/bioclock-flutter-${RELEASE_TAG}-android.apk" \
              "dist/bioclock-flutter-${RELEASE_TAG}-windows-x64.zip" \
              "dist/SHA256SUMS.txt" \
              --title "BioClock Flutter ${RELEASE_TAG}" \
              --notes-file release_notes.md
          fi
